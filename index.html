<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevTeam Task Manager</title>
<style>
  body {
    font-family: Arial, sans-serif;
    max-width: 700px;
    margin: 40px auto;
    padding: 20px;
    background: #f4f7fb;
    color: #1b2a41;
  }

  input, button {
    padding: 10px;
    font-size: 16px;
  }

  button {
    background: #1b5e9e;
    color: white;
    border: none;
    cursor: pointer;
  }
</style>
</head>
<body>
  <h1>DevTeam Task Manager - Your Daily Workspace</h1>
  <p>Organise your daily work simply and efficiently.</p>

  <h2>Add a Task</h2>
  <input type="text" id="taskInput" placeholder="Enter a task">
  <button>Add Task</button>

  <h2>My Tasks</h2>
  <ul id="taskList"></ul>
</body>
</html>
